// Vendored from github.com/nizwar/openvpn_library @ b3941ef040 (the exact
// commit `openvpn_flutter` 1.3.4 pins via JitPack as
// `com.github.nizwar:openvpn_library:b3941ef040`) — an ics-openvpn-derived
// Android library (package de.blinkt.openvpn). Vendored instead of pulled
// via JitPack so OpenVpnApi.java/VPNHelper.java can be patched locally: the
// upstream library never wires an OpenVPN profile's private-key decryption
// password (VpnProfile.mKeyPassword) through from the plugin's connect()
// call — only auth-user-pass's mUsername/mPassword — so a .ovpn whose <key>
// block is itself encrypted (a separate passphrase from login) can never
// connect through the unmodified library. See the keyPassword plumbing
// added to OpenVpnApi.java/VPNHelper.java in this vendored copy, and
// ../../third_party/openvpn_flutter (the plugin wrapper, also vendored and
// patched to pass it through) — never the user's actual .ovpn file/key.
apply plugin: 'com.android.library'

android {
    namespace 'de.blinkt.openvpn'
    compileSdk 36

    // Both default to false on modern AGP (used to be implicitly on) — this
    // library's AIDL-defined IPC interfaces (IOpenVPNServiceInternal etc.)
    // and its one BuildConfig.BUILD_TYPE check need them explicitly enabled.
    buildFeatures {
        aidl = true
        buildConfig = true
    }

    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 36
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.1.0'
    implementation 'androidx.appcompat:appcompat:1.6.0'
}
