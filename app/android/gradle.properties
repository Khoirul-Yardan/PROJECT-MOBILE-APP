org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# The project lives on a different drive (D:) than the Gradle/Pub caches
# (C:), and Kotlin's incremental-compilation cache tries to compute a
# relative path between them — which doesn't exist across Windows drive
# letters and crashes compileDebugKotlin ("this and base files have
# different roots"). Disabling incremental Kotlin compilation avoids that
# path computation entirely; it only makes rebuilds a bit slower.
kotlin.incremental=false
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
