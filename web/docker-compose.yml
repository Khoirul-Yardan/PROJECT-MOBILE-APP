services:
  mastra:
    profiles: [mastra]
    build: ../mastra-test
    ports:
      - "127.0.0.1:4111:4111"
    restart: unless-stopped
    environment:
      - MASTRA_HOST=0.0.0.0
    # Owner provider key + agent token for the authenticated connection route.
    # Only the legacy BYOK route still receives a provider key per request.
    env_file:
      - path: ../mastra-test/.env
        required: false

  web:
    build: .
    container_name: ai-hub-web
    ports:
      - "8090:80"
    restart: unless-stopped
    depends_on:
      - relay

  # Same-origin relay for self-hosted agent calls (A2A, OpenClaw) made from
  # a plain browser dev preview, where there's no native bridge to route
  # around their missing CORS headers — see relay/server.js for why this
  # exists. nginx proxies /relay/ to this service so the browser only ever
  # talks to :8090 (no cross-origin request at all, hence no CORS problem).
  relay:
    build: ./relay
    container_name: ai-hub-relay
    restart: unless-stopped
    # Optional: set this (in a .env file next to this compose file, or in
    # the shell before `docker compose up`) so Bot BPJS diarization works
    # for every device with no per-user AssemblyAI key — see
    # docs/ASSEMBLYAI-DIARIZATION.md. Left unset, the relay still runs fine;
    # the app just falls back to asking each nurse for her own key.
    environment:
      - ASSEMBLYAI_API_KEY=${ASSEMBLYAI_API_KEY:-}

  # Panel Admin (admin/): web penuh di http://localhost:8095, port berbeda dari
  # aplikasi (8090). Satu jaringan compose dengan web & relay, jadi halaman
  # Status bisa memeriksa keduanya lewat nama service. Menjadi satu-satunya
  # pemegang SUPABASE_SERVICE_KEY — isi di web/.env, bukan di sini. Lihat
  # docs/PANEL-ADMIN.md.
  admin:
    build:
      context: ../admin
    container_name: ai-hub-admin
    ports:
      - "8095:8095"
    restart: unless-stopped
    depends_on:
      - web
      - relay
    environment:
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - SESSION_SECRET=${SESSION_SECRET:-}
      - SUPABASE_URL=${SUPABASE_URL:-https://zcydtoywdcfjmhofdwwq.supabase.co}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY:-}
      - WEB_URL=http://web
      - RELAY_URL=http://relay:8091
    volumes:
      # Satu sumber SQL: file yang sama dipakai halaman "Status & Setup".
      - ../app/supabase/schema-admin.sql:/app/schema-admin.sql:ro
