server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The Flutter WebView is a different origin than this container, and
    # the JS bridge only trusts messages it receives directly inside the
    # WebView (not cross-origin postMessage) — CORS here just lets the page
    # be fetched/previewed from a plain browser too during development.
    add_header Access-Control-Allow-Origin "*" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Content that changes often (announcements) should never be cached by
    # an intermediate proxy/browser, so updates show up immediately without
    # an app release.
    location = /announcements.json {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }
}
