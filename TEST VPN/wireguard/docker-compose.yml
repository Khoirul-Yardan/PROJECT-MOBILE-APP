# Server WireGuard + SSH tiruan. up -d --build ; hasil: out/client.conf
services:
  wg-test:
    build: .
    container_name: wg-test
    cap_add: [NET_ADMIN]
    sysctls: ["net.ipv4.ip_forward=1"]
    ports:
      - "51820:51820/udp"
      - "2222:22/tcp"
    environment:
      - PUBLIC_HOST=${PUBLIC_HOST:-127.0.0.1}
    volumes:
      - ./out:/out
      - wg-state:/state
  wg-client:
    build: .
    profiles: ["test"]
    entrypoint: ["/usr/local/bin/test-client.sh"]
    cap_add: [NET_ADMIN]
    depends_on: [wg-test]
    volumes:
      - ./out:/out
volumes:
  wg-state:
